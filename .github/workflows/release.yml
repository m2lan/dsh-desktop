name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "dsh kernel version to embed (leave empty for baseline from scripts/kernel-version.json)"
        required: false
        default: ""

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend/dev dependencies
        run: npm install

      - name: Fetch portable Node runtime
        shell: bash
        run: node scripts/fetch-node.mjs --out src-tauri/node-runtime --version $(node -e "console.log(require('./scripts/node-version.json').version)")

      - name: Verify node runtime exists
        shell: bash
        run: |
          ls -la src-tauri/node-runtime/
          ls -la src-tauri/node-runtime/node/ | head -20
          if [ -f src-tauri/node-runtime/node/bin/node ] || [ -f src-tauri/node-runtime/node/node.exe ]; then
            echo "node binary found"
          else
            echo "node binary MISSING" >&2
            exit 1
          fi

      # Bake the pinned kernel into the installer so first launch is offline.
      # The app will copy resources/kernel -> $APPDATA/com.dsh.desktop/kernel on first run;
      # if the resource is missing it falls back to `npm install @deepseek-ai/dsh@<pinned>`.
      - name: Bake pinned kernel (offline)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -e "console.log(require('./scripts/kernel-version.json').version)")
          echo "Baking @deepseek-ai/dsh@$VER into src-tauri/resources/kernel (NODE_OPTIONS=$NODE_OPTIONS)"
          rm -rf src-tauri/resources/kernel src-tauri/resources/kernel.staging
          mkdir -p src-tauri/resources
          # npm 10 on Node 22 defaults to ~2GB heap and OOMs on the 50+ dsh deps (see last run: FATAL ERROR near heap limit)
          node --max-old-space-size=4096 scripts/fetch-dsh.mjs --dir src-tauri/resources/kernel --version "$VER"
          echo "--- baked kernel ---"
          cat src-tauri/resources/kernel/.dsh-kernel-version
          ls -lh src-tauri/resources/kernel/node_modules/@deepseek-ai/dsh/lib/bin.js
          du -sh src-tauri/resources/kernel

      - name: Build Tauri release bundles
        run: npm run build

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve kernel version
        id: kernel
        shell: bash
        run: |
          if [ -n "${{ inputs.kernel_version }}" ]; then
            echo "version=${{ inputs.kernel_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -e "console.log(require('./scripts/kernel-version.json').version)")" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: "Debug: show downloaded artifacts"
        shell: bash
        run: |
          echo "=== files under artifacts/ ==="
          find artifacts -type f | sort

      - name: Create (or reuse) the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists, reusing it"
            if [ "$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')" = "true" ]; then
              echo "existing release is a draft, publishing it"
              gh release edit "$TAG" --repo "$REPO" --draft=false
            fi
          else
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "dsh-desktop $TAG" \
              --notes "Kernel: @deepseek-ai/dsh@${{ steps.kernel.outputs.version }}"
            echo "created release $TAG"
          fi

      - name: Upload all platform artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          # Upload only installer archives, NOT the files inside macOS .app
          # directories (hundreds of tiny files — uploading them one-by-one
          # took 20+ minutes). Installers live at:
          #   bundle/nsis/*.exe, bundle/msi/*.msi, bundle/dmg/*.dmg,
          #   bundle/deb/*.deb, bundle/rpm/*.rpm, bundle/appimage/*.AppImage
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find artifacts -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.tar.gz' \) \
            -not -path '*/.app/*' -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No installer files matched under artifacts/ — nothing to upload." >&2
            exit 1
          fi

          echo "matched ${#files[@]} installer(s) to upload"
          for f in "${files[@]}"; do
            echo "uploading: $f"
            gh release upload "$TAG" "$f" --clobber --repo "$REPO"
          done

          echo "--- release assets ---"
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name'

          asset_count=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets | length')
          echo "total uploaded assets on release: $asset_count"
          if [ "$asset_count" -eq 0 ]; then
            echo "::error::Release $TAG has no uploaded assets after the upload step." >&2
            exit 1
          fi
