name: sync-upstream

on:
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC
  workflow_dispatch: {}

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Query latest @deepseek-ai/dsh from npm
        id: npm
        run: |
          JSON=$(node scripts/check-upstream.mjs)
          echo "JSON=$JSON"
          echo "version=$(echo "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')" >> "$GITHUB_OUTPUT"
          echo "latest=$(echo "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).latest))')" >> "$GITHUB_OUTPUT"
          echo "next=$(echo "$JSON" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).next))')" >> "$GITHUB_OUTPUT"

      - name: Compare with baseline
        id: compare
        run: |
          CURRENT=$(node -e "console.log(require('./scripts/kernel-version.json').version)")
          LATEST="${{ steps.npm.outputs.version }}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      # The kernel's own dependency ranges float (`^`), so the baseline bump and
      # its lockfile must land together — otherwise fetch-dsh.mjs sees a stale
      # lock, falls back to `npm install`, and the baked tree drifts again.
      - name: Bump baseline and regenerate the kernel lockfile
        if: steps.compare.outputs.changed == 'true'
        run: node scripts/make-kernel-lock.mjs --version "${{ steps.compare.outputs.latest }}" --update-baseline

      - name: Create bump PR
        if: steps.compare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/kernel-bump-${{ steps.compare.outputs.latest }}
          title: "chore: bump dsh kernel to ${{ steps.compare.outputs.latest }}"
          commit-message: "chore: bump dsh kernel to ${{ steps.compare.outputs.latest }}"
          delete-branch: true
          body: |
            Auto-detected a new upstream release of `@deepseek-ai/dsh`.

            - Current baseline: `${{ steps.compare.outputs.current }}`
            - New upstream version: `${{ steps.compare.outputs.latest }}`

            This PR updates both `scripts/kernel-version.json` and the pinned
            dependency tree in `scripts/kernel-lock/`. Merging it is enough —
            the release workflow will rebuild installers embedding the new
            kernel, resolved through the lock with `npm ci`.

            Review the lock diff before merging: a new transitive dependency can
            be large (e.g. `@deepseek-ai/libreoffice-kit-wasm` is 185 MiB).

      - name: No update available
        if: steps.compare.outputs.changed == 'false'
        run: echo "dsh kernel is already at ${{ steps.compare.outputs.current }} — nothing to do"
