[package]
name = "dsh-desktop"
version = "0.1.10"
description = "Tauri desktop shell for DeepSeek Harness (dsh) — shell/kernel separated, auto-updating"
authors = ["dsh-desktop contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
# tauri-plugin-updater = "2"   # optional: shell updates (see README "外壳更新")
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
